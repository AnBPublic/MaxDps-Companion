# CI = the OFFLINE verification bar only (docs/TESTING.md §1).
# Package A4 of docs/plans/2026-10-17-paragon-audit-remediation.md (Wave A).
#
# Scope: build + tests + Lua harness/luac + ability audit (Windows) and
# Core/Mac build + swiftc parse (macOS). No secrets, no publish/deploy steps.
# Static (parses/builds) != automated test != live: the live retail checklist
# (docs/TESTING.md §3) and the Mac capture path stay OWED until run on real
# hardware, and a green run here never closes those items.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: windows-latest - build, tests, lua, ability audit
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            app/MaxDpsCompanion/MaxDpsCompanion.csproj
            app/MaxDpsCompanion.Core/MaxDpsCompanion.Core.csproj
            tests/MaxDpsCompanion.Tests/MaxDpsCompanion.Tests.csproj

      # docs/TESTING.md §1 / AGENTS.md "Offline verification bar".
      - name: Build Windows app (Release)
        run: dotnet build app/MaxDpsCompanion/MaxDpsCompanion.csproj -c Release

      # The test project loads the Windows app assembly, which carries the
      # Windows App SDK bootstrap module initializer. The runner has no Windows
      # App Runtime 1.8, so that initializer blocks testhost before the first
      # test (first CI run hung 9 min at this step). The tests never create
      # XAML/STA windows, so the suite is built with the initializer off; the
      # step above still builds the real (bootstrapped) app.
      - name: Test C# suite (Release)
        working-directory: tests/MaxDpsCompanion.Tests
        run: dotnet test -c Release -p:WindowsAppSdkBootstrapInitialize=false

      # leafo/gh-actions-lua builds Lua 5.4 + luac from source with MSVC on
      # Windows, so the MSVC developer shell must be active first.
      - name: Prepare MSVC dev shell
        uses: step-security/msvc-dev-cmd@v1

      - name: Install Lua 5.4
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.4'

      - name: Lua addon harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          lua tests/secret_harness.lua
          if ($LASTEXITCODE -ne 0) { throw "tests/secret_harness.lua failed (exit $LASTEXITCODE)" }

      - name: luac -p every Exp addon file (recursive)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $luac = Get-Command luac -ErrorAction SilentlyContinue
          if (-not $luac) { throw 'luac not found on PATH (leafo/gh-actions-lua installs lua + luac)' }
          $files = @(Get-ChildItem -LiteralPath 'addon\MaxDpsCompanionBridge' -Filter '*.lua' -File -Recurse)
          if ($files.Count -eq 0) { throw 'no .lua files found under addon\MaxDpsCompanionBridge' }
          $failed = @()
          foreach ($f in $files) {
            & $luac.Source -p $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $f.FullName }
          }
          Write-Host ("luac -p: {0} file(s) checked, {1} failed" -f $files.Count, $failed.Count)
          if ($failed.Count -gt 0) { throw ("luac -p failed: " + ($failed -join '; ')) }

      # Exit codes: 0 clean (the committed addon/MaxDpsCompanionBridge/Catalog.lua
      # must byte-match the generated output; drift is reported, never auto-fixed),
      # 1 failed run, 3 non-clean audit. Only 0 is accepted here.
      - name: Ability audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/ability_audit.ps1
          $code = $LASTEXITCODE
          Write-Host "tools/ability_audit.ps1 exit code: $code"
          if ($code -ne 0) {
            throw "tools/ability_audit.ps1 failed with exit code $code"
          }

      - name: Package versioned Windows companion and addon
        if: ${{ startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$props = Get-Content 'app/Version.props' -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          $codename = [string]$props.Project.PropertyGroup.Codename
          New-Item -ItemType Directory -Force -Path 'release-output/windows' | Out-Null
          dotnet publish app/MaxDpsCompanion/MaxDpsCompanion.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:EnableMsixTooling=true -p:WindowsPackageType=None -p:PublishSingleFile=false -o release-output/windows
          if ($LASTEXITCODE -ne 0) { throw "Windows publish failed: $LASTEXITCODE" }
          foreach ($required in @('MaxDpsCompanion.exe', 'MaxDpsCompanion.pri')) {
            if (-not (Test-Path -LiteralPath "release-output/windows/$required")) { throw "Missing $required after publish" }
          }
          Set-Content -Path 'release-output/windows/VERSION.txt' -Value "$version $codename"
          Compress-Archive -Path 'release-output/windows/*' -DestinationPath "release-output/MaxDpsCompanion-$version-$codename-win-x64.zip" -CompressionLevel Optimal
          Compress-Archive -Path 'addon/MaxDpsCompanionBridge' -DestinationPath "release-output/MaxDpsCompanionBridge-$version.zip" -CompressionLevel Optimal
          Write-Host "Built versioned Windows and addon ZIPs for $version $codename"

      - name: Upload companion + addon install bundles
        if: ${{ startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: MaxDpsCompanion-release-bundles
          path: release-output/*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macos-latest - Core + Mac build, swiftc parse
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            app/MaxDpsCompanion.Core/MaxDpsCompanion.Core.csproj
            app/MaxDpsCompanion.Mac/MaxDpsCompanion.Mac.csproj

      # The release path is shell + Swift. Parse every shell script so a typo
      # cannot reach the tag-only release workflow (which is dispatch-driven).
      - name: Shell syntax (macOS build + release scripts)
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-mac.sh \
            tools/mac-signing.sh \
            tools/package-macos.sh \
            tools/install-addon-mac.sh
          echo "bash -n: OK"

      - name: Build Core (Release)
        run: dotnet build app/MaxDpsCompanion.Core/MaxDpsCompanion.Core.csproj -c Release

      - name: Build Mac host (Release)
        run: dotnet build app/MaxDpsCompanion.Mac/MaxDpsCompanion.Mac.csproj -c Release

      # Syntax-only check of the capture library source. The real dylib is
      # produced by build-mac.sh (swiftc -emit-library, pinned deployment
      # target); capture itself needs ScreenCaptureKit + a real Mac -> OWED.
      - name: Swift syntax check (MdcCapture.swift)
        shell: bash
        run: |
          set -euo pipefail
          src=app/MaxDpsCompanion.Mac/native/MdcCapture.swift
          test -f "$src"
          if swiftc -parse "$src"; then
            echo "swiftc -parse: OK"
          else
            echo "swiftc -parse failed; retrying with -typecheck against the macOS SDK"
            swiftc -typecheck -sdk "$(xcrun --show-sdk-path)" "$src"
            echo "swiftc -typecheck: OK"
          fi

  publish_candidate:
    name: Publish Ascendant release-candidate ZIPs
    needs: [windows, macos]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/v5.0.0-ascendant' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the verified Windows and addon bundles
        uses: actions/download-artifact@v4
        with:
          name: MaxDpsCompanion-release-bundles
          path: release-output

      - name: Publish GitHub prerelease from the verified commit
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0-rc.4
          target_commitish: ${{ github.sha }}
          name: MaxDPS Companion v5.0.0 Ascendant (Release Candidate)
          prerelease: true
          draft: false
          generate_release_notes: false
          body: |
            Ascendant v5.0.0: shared observed sustained-health
            pressure, measurable short-fight conservation of long
            companion gap-fill cooldowns, 40-spec inventory audit,
            and reduced health-monitor GC. Targets Retail 12.1.5
            (TOC 120105). Spell registry remains sourced from 12.1;
            unverified all-talent claims are prohibited. Existing
            MaxDps Main policy and 51/58-cell wire are preserved.
            Real all-content tests and FPS A/B are still required.

            Windows and addon ZIPs are below. Preserve your settings.ini
            and official MaxDps addon. For download, backup, install,
            rollback and matched FPS tests read docs/HANDOVER-ASCENDANT-5.0.0.md.

            Offline CI passed; LIVE WoW Retail verification is STILL OWED.
          files: |
            release-output/MaxDpsCompanion-5.0.0-Ascendant-win-x64.zip
            release-output/MaxDpsCompanionBridge-5.0.0.zip
          fail_on_unmatched_files: true
