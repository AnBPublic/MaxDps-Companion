; MaxDps Companion default settings.
; CellSize/OffsetX/OffsetY must match the addon's '/mdb status' output.
; This tracked default is copied next to the exe on first publish only;
; per-machine edits live in dist\settings.ini and are never committed.

; Settings schema version; stamped on Save so the v3.5 Mobility/CrowdControl
; migration runs at most once.
[Meta]
ConfigVersion=1

[Bridge]
CellSize=8
OffsetX=0
OffsetY=0

[Window]
ProcessName=Wow
AllowBackgroundKeys=1
; Layout tag (classic3 = v3 classic shell); forces size reset on shell change.
Layout=

[Pause]
Button=Pause

; Slot order: spell1=Main, spell2=Offensive, spell3=Defensive,
; spell4=Consumable, spell5=Trinket, spell6=Interrupt,
; spell7=Mobility (gap closers), spell8=SelfHeal (solo mode only)
[Spells]
spell1=1
spell2=1
spell3=1
spell4=1
spell5=0
spell6=0
spell7=1
spell8=1

[Timing]
PollIntervalMs=33
MinKeyIntervalMs=120
KeyPressMs=25

; TargetKey is pressed when the bridge reports no-target (state 3) and AutoTarget is on.
; Never set it to a movement key (WASD / Space / arrows) - the app refuses to send those.
[Targeting]
AutoTargetEnabled=0
CombatOnly=1
TargetKey=Tab

; InteractKey is pressed when the bridge reports need-interact (state 4) and Interact is on.
[Interact]
InteractEnabled=0
InteractKey=F

; Deterministic action scheduler (default on): owns send order and pacing.
; Link gate (HeartbeatTimeoutMs): a frozen heartbeat means the addon stopped
; rendering, so nothing fires. A press that never starts a GCD inside ~600 ms
; is treated as a failed action and its key is briefly suppressed instead of
; being hammered; the same key sent too often in 1.5 s backs off the same way.
; 0 = legacy MaxDps priority loop.
[Scheduler]
Enabled=1
HeartbeatTimeoutMs=500
RepeatSuppressMs=900

; Situational intelligence (default on). Every situational suggestion
; (offensive/defensive/interrupt/consumable/trinket/mobility/self-heal) is
; evaluated USE / HOLD / SKIP against the embedded ability knowledge base and
; the protocol-v5 combat context (range, casts, HP, MaxDps defensive urgency). The MAIN rotation is
; never gated by knowledge. 0 = pre-intelligence behaviour (every MaxDps
; suggestion fires; companion-only slots are off).
; StaleAfterMs: a pressed-and-unchanged candidate is demoted behind a fresh one.
[Intelligence]
Enabled=1
StaleAfterMs=1500
; HP curve strip (1 = on): paints cell 35 from the player HP fraction.
HpCurve=1

; Per-target time-to-kill estimation (default on). 0 = no estimator; every
; TTK gate is skipped. Invalid estimates always fail open.
; Fallback: FailOpen (default) = unknown TTK never holds a cooldown;
; ConserveMajors = hold any unknown-TTK major without a fast-pack latch.
; Adaptive real-data history (v3.7): learn the burn rate from the last
; HistoryKills kills (3..20) no older than HistoryMaxAgeSec (30..900), bind
; once >= HistoryMinKills (2..10) are known, use the HistoryQuantile (50..95)
; burn-rate percentile and require HistoryDurFactor (0..1) of an active
; duration. History=0 = pre-history behaviour.
[TimeToKill]
Enabled=1
Fallback=FailOpen
History=1
HistoryKills=8
HistoryMinKills=3
HistoryMaxAgeSec=240
HistoryQuantile=75
HistoryDurFactor=0.5
WarmupSec=3

; Crowd-control appendix (default on since v3.5; RC2 fix). ON makes curated
; auto-eligible CC rows eligible on a confirmed target; the in-game toggle can
; only further restrict. Pre-3.5 installs are migrated ON once.
[CrowdControl]
Enabled=1

; Solo / self-sustain mode (default off; requires [Intelligence] Enabled=1).
; Below SelfSustainHpPct efficient self-heals become eligible; below
; EmergencyHpPct survival actions outrank damage; a major defensive waits
; while a minor runs and HP is above DefensiveEscalateHpPct.
[Solo]
Enabled=0
EmergencyHpPct=35
SelfSustainHpPct=65
DefensiveEscalateHpPct=60
EscalationEnabled=1
MinorHpPct=75
MajorHpPct=50
ImmunityHpPct=30

; Per-ability automatic-use overrides (v2.3 defensive intelligence),
; comma-separated spell ids. On = explicitly enabled (a default-off ability
; turned ON); Off = explicitly disabled (a default-on ability turned OFF).
; OFF never fires automatically; ON is eligibility, not spam. Modes = optional
; id:Mode pairs for the richer model (SoloOnly/NormalOnly/Manual/Never/Always/
; Automatic); the UI writes On/Off only. Empty = curated catalog default.
[Abilities]
On=
Off=
Modes=

; Local rotation telemetry (opt-in, default off). Bounded in-memory JSONL
; ring: keybinds/flags/timestamps/decisions only, no Blizzard values, no
; network. Export from Advanced, then replay with --replay=<file>.
[Telemetry]
Enabled=0
Capacity=10000

; Empty = unlearned. Filled in by '/mdb calibrate' learning pass.
[Color]

; BNetPath empty = auto-detect Battle.net. Launch Game uses the launcher's
; remembered account — no credentials are stored anywhere.
[Launch]
BNetPath=
