[package]
name = "mdc-app"
description = "Thin eframe/egui shell: pro-panel dock layout, left rail, Ctrl+K command palette, status bar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mdc-commands = { path = "../mdc-commands" }
eframe = "0.36"
egui = "0.36"
egui_dock = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[build-dependencies]
winres = "0.1"
